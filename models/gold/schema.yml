version: 2

models:
  - name: dim_customers
    description: One row per customer
    columns:
      - name: customer_id
        data_tests: [not_null, unique]

  - name: dim_products
    description: One row per product
    columns:
      - name: product_id
        data_tests: [not_null, unique]

  - name: fct_orders
    description: One row per order item
    columns:
      - name: order_item_id
        data_tests: [not_null, unique]
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                  to: ref('dim_customers')
                  field: customer_id
      - name: product_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                  to: ref('dim_products')
                  field: product_id